{{ define "main" }}
  <div class="index-shell">
    <header class="index-header">
      <p class="eyebrow">{{ i18n "eyebrowIndex" }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}
        <p class="index-intro">{{ . }}</p>
      {{ end }}
      {{ with .Content }}
        <div class="index-copy prose">{{ . }}</div>
      {{ end }}
    </header>

    {{ partial "content/entry-list.html" (dict "pages" .Pages "context" .) }}
  </div>
{{ end }}
